name: CI

on:
  push:
    branches:
      - main
      - 'feature-*'
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['15.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci
        working-directory: codebase/rdicidr-0.1.0

      - name: Run lint
        run: npm run lint
        working-directory: codebase/rdicidr-0.1.0

      - name: Run tests
        run: npm test -- --watchAll=false
        working-directory: codebase/rdicidr-0.1.0

      - name: Build app
        run: npm run build
        working-directory: codebase/rdicidr-0.1.0
